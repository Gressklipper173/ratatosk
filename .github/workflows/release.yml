name: Release image

# Push a tag like v0.1.0 to build amd64 and arm64 images and publish them to GHCR.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Never let two releases push at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag, the VERSION file and the newest CHANGELOG entry must agree, so the page shows the
      # version the image is tagged with.
      - name: Tag matches VERSION and CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file=$(tr -d '[:space:]' < VERSION)
          top=$(grep -m1 '^## ' CHANGELOG.md | sed -E 's/^## ([^ ]+).*/\1/')
          echo "tag=$tag VERSION=$file CHANGELOG=$top"
          [ "$tag" = "$file" ] && [ "$tag" = "$top" ]

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-test.txt
          python -m pytest -q

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name is lowercased for you. Tags for v1.2.3: 1.2.3, 1.2, 1 and latest; the bare
      # major (and so ":0") is left out for 0.x, where minors may still break things.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
