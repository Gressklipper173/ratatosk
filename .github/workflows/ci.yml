name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (the comment names the release). Dependabot keeps them current.
jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same minor version as the image's base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      # two runs: requirements.txt is hash-locked, the test tools are only version-pinned
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q

  frontend:
    name: Page script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test tests/js/*.mjs
      # one call per file: a single call with several files checks only the first
      - run: for f in static/*.js; do node --check "$f"; done

  image:
    name: Image builds and turns healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ratatosk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Runs the image the way the compose example does (Docker socket, no-new-privileges) and waits
      # for the HEALTHCHECK, which calls /healthz and needs a working Docker socket.
      - name: Run it and wait for the health check
        run: |
          docker run -d --name ratatosk-ci \
            --security-opt no-new-privileges:true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ratatosk:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ratatosk-ci)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          docker logs ratatosk-ci
          exit 1
      - name: Image reports the VERSION file
        run: |
          expected=$(tr -d '[:space:]' < VERSION)
          docker exec ratatosk-ci cat /app/VERSION | tr -d '[:space:]' | grep -qx "$expected"
