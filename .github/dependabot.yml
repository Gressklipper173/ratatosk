# Actions and base images are pinned by SHA/digest, so something has to move them forward.
# Python packages are not listed: requirements.txt is generated with hashes by pip-compile
# (see CONTRIBUTING.md), which Dependabot would not keep in step.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    # Official images re-push a version tag when they rebuild it, which shows up here as a new
    # digest for the same version. Monthly batches those.
    schedule:
      interval: monthly
    ignore:
      # Stay on the Python minor version the tests and the README name (3.12). Patch releases still
      # come through; moving to a new minor is a deliberate change to the CI files too.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
