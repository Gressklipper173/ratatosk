services:
  ratatosk:
    build: .
    container_name: ratatosk
    restart: unless-stopped
    # Opens the dashboard on this machine only. To reach it from other devices on your
    # network, change this to "8090:8090" (all interfaces), or to "<this host's LAN address>:8090:8090".
    # Docker's published ports bypass the host firewall, so only do that on a private network.
    ports:
      - "127.0.0.1:8090:8090"
    # Stops a process in the container gaining new privileges (Ratatosk itself runs as root).
    security_opt:
      - no-new-privileges:true
    environment:
      # set to true to disable start/stop/restart
      READ_ONLY: "false"
      # set to false to stop checking registries for newer images
      UPDATE_CHECK: "true"
      # set to true only if a reverse proxy or tunnel is the only way in (see README, Security)
      BEHIND_PROXY: "false"
      # with BEHIND_PROXY: which header carries the visitor's address, "xff" (X-Forwarded-For,
      # the default) or "cf" (Cloudflare's CF-Connecting-IP). The proxy must overwrite it.
      # PROXY_IP_HEADER: "xff"
    # Ratatosk is meant to run all the time, so cap Docker's copy of its output.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional, for integrations: lets Ratatosk reach an app through the port it
    # publishes on this host when it isn't on the same Docker network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ratatosk-data:/data
      # Grants control of every container on this host (root-equivalent).
      # Keep Ratatosk off the public internet; see README.
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional, for the Update button: mount each Compose project's folder at the
      # same path it has on the host (read-only is fine). Example:
      # - /home/me/media:/home/me/media:ro
      # Optional, for your own integration adapters (see docs/ADAPTERS.md):
      # - ./my-adapters:/data/adapters:ro

volumes:
  ratatosk-data:
